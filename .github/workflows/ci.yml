name: CI

on:
  push:
    branches: [main]
  pull_request:

# tech-stack.md §7. The quality gates that need real pages - Lighthouse CI, axe-core,
# Playwright visual regression, the link checker - land in 8.12. This is the skeleton
# phases.md 8.1 asks for: typecheck, lint, format, contrast, build.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Token contrast (WCAG 2.2 AA)
        run: npm run contrast
      - name: Build
        run: npm run build
      # SEO audit H7. vnu.jar needs Java 11+; the Ubuntu runner ships one.
      - name: HTML validation (Nu)
        run: npm run validate:html
      - name: Design-token and font-fallback regressions
        run: npx playwright install --with-deps chrome && npm test
